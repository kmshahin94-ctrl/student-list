<!DOCTYPE html>
<html lang="bn">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ছাত্র তালিকা | মদিনাতুল উলূম দৃষ্টি প্রতিবন্ধী এতিমখানা</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			--ink: #183238;
			--muted: #687b7e;
			--paper: #f7f4ed;
			--white: #fffdf9;
			--teal: #087f7b;
			--teal-dark: #075b5a;
			--coral: #d9654d;
			--line: #dfe6df;
			--shadow: 0 18px 45px rgba(25, 62, 59, .1);
		}
		* { box-sizing: border-box; }
		body { margin: 0; color: var(--ink); background: var(--paper); font-family: 'Hind Siliguri', sans-serif; }
		.page { max-width: 1240px; margin: auto; padding: 28px 22px 60px; }
		header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 30px; }
		.eyebrow { color: var(--teal); font-size: .92rem; font-weight: 700; letter-spacing: .02em; line-height: 1.25; margin: 0 0 2px; }
		h1, h2, h3 { font-family: 'Noto Serif Bengali', serif; margin: 0; }
		h1 { font-size: clamp(2rem, 4vw, 3.4rem); line-height: 1.15; }
		.intro { max-width: 620px; color: var(--muted); font-size: 1.08rem; margin: 12px 0 0; }
		.count { background: var(--teal); color: white; padding: 10px 17px; border-radius: 4px; font-weight: 700; white-space: nowrap; }
		.search-box { margin-bottom: 18px; }
		.search-box input { margin-top: 0; padding: 13px 14px; font-size: 1rem; box-shadow: 0 8px 22px rgba(25, 62, 59, .06); }
		.layout { display: grid; grid-template-columns: 330px 1fr; gap: 28px; align-items: start; }
		.panel, .student-card { background: var(--white); border: 1px solid var(--line); box-shadow: var(--shadow); }
		.panel { padding: 23px; position: sticky; top: 18px; }
		.panel h2 { font-size: 1.35rem; margin-bottom: 17px; }
		label { display: block; font-weight: 600; margin-top: 13px; }
		input, textarea { width: 100%; border: 1px solid #cbd8d3; border-radius: 3px; padding: 10px 11px; margin-top: 5px; color: var(--ink); background: #fff; font: inherit; }
		textarea { resize: vertical; min-height: 74px; }
		input:focus, textarea:focus { outline: 2px solid #8bc9c1; border-color: var(--teal); }
		.hint { color: var(--muted); font-size: .85rem; line-height: 1.35; margin: 4px 0 0; }
		button { border: 0; border-radius: 3px; cursor: pointer; font: inherit; font-weight: 700; }
		.primary { width: 100%; background: var(--teal); color: white; padding: 12px; margin-top: 20px; }
		.primary:hover { background: var(--teal-dark); }
		.secondary { background: transparent; color: var(--coral); padding: 9px 0; width: 100%; margin-top: 4px; }
		.student-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 22px; }
		.student-card { overflow: hidden; animation: appear .45s ease both; }
		.gallery { display: grid; grid-template-columns: 1fr; grid-auto-rows: 280px; gap: 4px; background: #edf4ef; }
		.gallery img { width: 100%; height: 100%; object-fit: contain; display: block; }
		.card-body { padding: 18px; }
		.card-top { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
		.card-top h3 { font-size: 1.45rem; line-height: 1.25; }
		.card-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: end; }
		.delete { color: var(--coral); background: #fff1ec; padding: 5px 9px; font-size: .82rem; }
		.student-pdf { color: var(--teal-dark); background: #e5f3ed; padding: 5px 9px; font-size: .82rem; }
		.details { margin: 15px 0 0; border-top: 1px solid var(--line); padding-top: 11px; }
		.detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; color: var(--muted); }
		.detail-row strong { color: var(--ink); text-align: right; font-weight: 600; }
		.story { color: var(--muted); margin: 10px 0 0; line-height: 1.5; white-space: pre-line; }
		.sponsor { margin-top: 16px; padding: 13px; background: #edf7f1; border-left: 4px solid var(--teal); }
		.sponsor.pending { background: #fff5e8; border-left-color: #e4a13c; }
		.sponsor-title { color: var(--teal-dark); font-weight: 700; margin-bottom: 3px; }
		.pending .sponsor-title { color: #9c671d; }
		.sponsor p { margin: 2px 0; color: var(--muted); }
		.sponsor a { color: var(--teal-dark); font-weight: 700; text-decoration: none; }
		.empty { color: var(--muted); text-align: center; padding: 60px 20px; border: 1px dashed #bbcfc7; background: rgba(255,255,255,.45); }
		@keyframes appear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
		@media print {
			body { background: white; }
			.page { max-width: none; padding: 0; }
			.panel, .search-box, .delete, .print-button { display: none; }
			header { margin-bottom: 18px; }
			.layout { display: block; }
			.student-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
			.student-card { box-shadow: none; break-inside: avoid; }
			body.print-single .student-card:not(.print-target) { display: none; }
			.student-pdf { display: none; }
			.gallery { grid-auto-rows: 190px; }
		}
		@media (max-width: 780px) { header { display: block; } .count { display: inline-block; margin-top: 17px; } .layout { grid-template-columns: 1fr; } .panel { position: static; } }
	</style>
</head>
<body>
	<main class="page">
		<header>
			<div>
				<p class="eyebrow">মদিনাতুল উলূম দৃষ্টি প্রতিবন্ধী এতিমখানা</p>
				<p class="eyebrow">লিল্লাহ বোর্ডিং মাদ্রাসা</p>
				<h1>আমাদের ছাত্র তালিকা</h1>
				<p class="intro">প্রতিটি শিশুর শিক্ষা ও ভবিষ্যতের পাশে দাঁড়াতে তাদের পরিচয়, প্রয়োজন এবং দায়িত্ব নেওয়া দাতার তথ্য এখানে সংরক্ষণ করুন।</p>
			</div>
			<div class="count" id="studentCount">০ জন ছাত্র</div>
		</header>

		<section class="layout">
			<form class="panel" id="studentForm">
				<h2>নতুন ছাত্র যোগ করুন</h2>
				<label>ছাত্রের নাম *<input name="name" required placeholder="যেমন: মোছা. সুমাইয়া আক্তার"></label>
				<label>ডিভাইস থেকে ছবি<input name="imageFiles" type="file" accept="image/*" multiple></label>
				<p class="hint">আপনার ডিভাইস থেকে সর্বোচ্চ ৩টি ছবি বাছাই করুন।</p>
				<label>বয়স<input name="age" placeholder="যেমন: ১০ বছর"></label>
				<label>শ্রেণি<input name="className" placeholder="যেমন: ৪র্থ শ্রেণি"></label>
				<label>ঠিকানা<input name="address" placeholder="গ্রাম, উপজেলা, জেলা"></label>
				<label>শিক্ষা ও প্রয়োজনের বিস্তারিত<textarea name="story" placeholder="শিশুটির পড়াশোনা, পরিবারের অবস্থা বা সহায়তার প্রয়োজন লিখুন"></textarea></label>
				<label>দাতার নাম<input name="donorName" placeholder="দায়িত্ব নেওয়া ব্যক্তির নাম"></label>
				<label>দাতার ফোন নম্বর<input name="donorPhone" type="tel" placeholder="০১xxxxxxxxx"></label>
				<button class="primary" type="submit">ছাত্রের তথ্য সংরক্ষণ করুন</button>
				<button class="secondary" type="button" id="clearData">সব তথ্য মুছে ফেলুন</button>
			</form>

			<section aria-live="polite">
				<div class="search-box"><input id="searchInput" type="search" placeholder="নাম অথবা ফোন নম্বর দিয়ে খুঁজুন..." aria-label="নাম অথবা ফোন নম্বর দিয়ে খুঁজুন"></div>
				<div class="student-grid" id="studentList"></div>
			</section>
		</section>
	</main>
	<script>
		const storageKey = 'manav-seva-students';
		const fallbackImages = [
			'https://images.unsplash.com/photo-1509099836639-18ba1795216d?w=900&q=80',
			'https://images.unsplash.com/photo-1542810634-71277d95dcbb?w=700&q=80',
			'https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?w=700&q=80'
		];
		const form = document.querySelector('#studentForm');
		const list = document.querySelector('#studentList');
		const count = document.querySelector('#studentCount');
		const searchInput = document.querySelector('#searchInput');
		let students = JSON.parse(localStorage.getItem(storageKey) || '[]');

		const escapeHtml = (value = '') => String(value).replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
		const toBanglaNumber = value => String(value).replace(/\d/g, digit => '০১২৩৪৫৬৭৮৯'[digit]);
		const normalizeSearch = value => String(value || '').toLowerCase().replace(/[০-৯]/g, digit => '0123456789'['০১২৩৪৫৬৭৮৯'.indexOf(digit)]).trim();

		function render() {
			count.textContent = `${toBanglaNumber(students.length)} জন ছাত্র`;
			if (!students.length) {
				list.innerHTML = '<div class="empty">এখনো কোনো ছাত্রের তথ্য যোগ করা হয়নি।<br>বাম পাশের ফর্ম থেকে প্রথম প্রোফাইলটি তৈরি করুন।</div>';
				return;
			}
			const query = normalizeSearch(searchInput.value);
			const matchingStudents = students.map((student, index) => ({ student, index })).filter(({ student }) => !query || [student.name, student.donorName, student.donorPhone].some(value => normalizeSearch(value).includes(query)));
			if (!matchingStudents.length) {
				list.innerHTML = '<div class="empty">এই নাম বা নম্বরের কোনো ছাত্র পাওয়া যায়নি।</div>';
				return;
			}
			list.innerHTML = matchingStudents.map(({ student, index }) => {
				const images = (student.images.length ? student.images : fallbackImages).slice(0, 3);
				const imageMarkup = images.map((image, imageIndex) => `<img src="${escapeHtml(image)}" alt="${escapeHtml(student.name)} - ছবি ${imageIndex + 1}" onerror="this.src='${fallbackImages[imageIndex % fallbackImages.length]}'">`).join('');
				const donorMarkup = student.donorName
					? `<div class="sponsor"><div class="sponsor-title">দায়িত্ব নেওয়া দাতা</div><p>${escapeHtml(student.donorName)}</p><a href="tel:${escapeHtml(student.donorPhone)}">${escapeHtml(student.donorPhone || 'ফোন নম্বর দেওয়া হয়নি')}</a></div>`
					: '<div class="sponsor pending"><div class="sponsor-title">এখনো দায়িত্ব নেওয়া হয়নি</div><p>এই শিশুটির পাশে দাঁড়াতে একজন দাতা প্রয়োজন।</p></div>';
				return `<article class="student-card" data-student-index="${index}"><div class="gallery">${imageMarkup}</div><div class="card-body"><div class="card-top"><h3>${escapeHtml(student.name)}</h3><div class="card-actions"><button class="student-pdf" type="button" data-print="${index}">ডাউনলোড</button><button class="delete" type="button" data-delete="${index}">মুছে ফেলুন</button></div></div><div class="details"><div class="detail-row"><span>বয়স</span><strong>${escapeHtml(student.age || 'তথ্য নেই')}</strong></div><div class="detail-row"><span>শ্রেণি</span><strong>${escapeHtml(student.className || student.classInfo || 'তথ্য নেই')}</strong></div><div class="detail-row"><span>ঠিকানা</span><strong>${escapeHtml(student.address || 'তথ্য নেই')}</strong></div></div><p class="story">${escapeHtml(student.story || 'এই ছাত্রের বিস্তারিত তথ্য এখনো যোগ করা হয়নি।')}</p>${donorMarkup}</div></article>`;
			}).join('');
		}
		searchInput.addEventListener('input', render);
		window.addEventListener('afterprint', () => {
			document.body.classList.remove('print-single');
			document.querySelectorAll('.print-target').forEach(card => card.classList.remove('print-target'));
		});

		form.addEventListener('submit', async event => {
			event.preventDefault();
			const data = new FormData(form);
			const selectedFiles = Array.from(data.getAll('imageFiles')).filter(file => file.size);
			const fileImages = await Promise.all(selectedFiles.slice(0, 3).map(file => new Promise(resolve => {
				const reader = new FileReader();
				reader.onload = () => resolve(reader.result);
				reader.onerror = () => resolve('');
				reader.readAsDataURL(file);
			})));
			students.unshift({
				name: data.get('name').trim(),
				images: fileImages.filter(Boolean).slice(0, 3),
				age: data.get('age').trim(),
				className: data.get('className').trim(),
				address: data.get('address').trim(),
				story: data.get('story').trim(),
				donorName: data.get('donorName').trim(),
				donorPhone: data.get('donorPhone').trim()
			});
			localStorage.setItem(storageKey, JSON.stringify(students));
			form.reset();
			render();
		});
		list.addEventListener('click', event => {
			const printButton = event.target.closest('[data-print]');
			if (printButton) {
				document.querySelectorAll('.print-target').forEach(card => card.classList.remove('print-target'));
				const targetCard = document.querySelector(`[data-student-index="${printButton.dataset.print}"]`);
				if (targetCard) {
					targetCard.classList.add('print-target');
					document.body.classList.add('print-single');
					window.print();
				}
				return;
			}
			const button = event.target.closest('[data-delete]');
			if (!button) return;
			students.splice(Number(button.dataset.delete), 1);
			localStorage.setItem(storageKey, JSON.stringify(students));
			render();
		});
		document.querySelector('#clearData').addEventListener('click', () => {
			if (!students.length || confirm('সব ছাত্রের তথ্য মুছে ফেলবেন?')) {
				students = [];
				localStorage.removeItem(storageKey);
				render();
			}
		});
		render();
	</script>
</body>
</html>
